<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Digital - LANANG 2 BAHAGIA</title>
    <!-- Menggunakan pustaka QRCode.js untuk generate QR Code secara otomatis -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #f4f4f4; margin: 20px; }
        .kasir-container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { border-bottom: 2px solid #333; padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; font-weight: bold; width: 100%; border-radius: 4px; }
        button:hover { background: #218838; }
        
        /* Gaya Tampilan Struk / Printer Thermal (Lebar 58mm / 80mm) */
        #struk-cetak { width: 300px; background: #fff; padding: 15px; margin: 0 auto; border: 1px dashed #ccc; box-shadow: 0 0 5px rgba(0,0,0,0.05); text-align: center; font-size: 13px; line-height: 1.4; color: #000; }
        .text-left { text-align: left; }
        .text-right { text-align: right; }
        .flex-row { display: flex; justify-content: space-between; }
        .garis-pemisah { border-top: 1px dashed #000; margin: 8px 0; }
        .garis-tebal { border-top: 2px double #000; margin: 8px 0; }
        .qr-wrapper { display: flex; justify-content: center; margin-top: 10px; }
        
        /* Sembunyikan elemen kasir saat mencetak fisik via browser */
        @media print {
            body * { visibility: hidden; }
            #struk-cetak, #struk-cetak * { visibility: visible; }
            #struk-cetak { position: absolute; left: 0; top: 0; border: none; box-shadow: none; }
        }
    </style>
</head>
<body>

<!-- 1. ANTARMUKA KASIR DIGITAL -->
<div class="kasir-container">
    <h2>🛒 Kasir Digital - LANANG 2 BAHAGIA</h2>
    <div class="form-group">
        <label>Pilih Item dari Daftar</label>
        <select id="pilih-barang" onchange="hitungSubtotal()">
            <option value="">-- Pilih Barang / Servis --</option>
            <option value="Servis HP" data-harga="75000">Servis HP (Segala Kerusakan)</option>
            <option value="Isi Ulang Gas 3 Kg" data-harga="22000">Isi Ulang Gas 3 Kg</option>
            <option value="Peralatan Mayit" data-harga="450000">Peralatan Mayit Lengkap</option>
            <option value="Sewa Kompor Gas" data-harga="50000">Sewa Kompor Gas</option>
        </select>
    </div>
    <div class="form-group">
        <label>Quantity (Jumlah)</label>
        <input type="number" id="qty-barang" value="1" min="1" oninput="hitungSubtotal()">
    </div>
    <div class="form-group">
        <label>Uang Diterima (Rp)</label>
        <input type="number" id="uang-bayar" value="0" oninput="hitungKembalian()">
    </div>
    <button onclick="prosesTransaksi()">💾 Simpan & Cetak Struk</button>
</div>

<!-- 2. LAYOUT STRUK BELANJA FISIK -->
<div id="struk-cetak">
    <strong style="font-size: 16px;">LANANG 2 BAHAGIA</strong><br>
    Jl. Raya Jagapura Lor Blok Nyibanda<br>
    Solusi Kebutuhan Anda
    
    <div class="garis-tebal"></div>
    
    <!-- Bagian Item Belanja -->
    <div id="item-list-struk">
        <!-- Item belanja yang dipilih muncul di sini secara dinamis -->
        <div class="flex-row">
            <span class="text-left">Belum ada item dipilih</span>
            <span class="text-right">Rp 0</span>
        </div>
    </div>
    
    <div class="garis-pemisah"></div>
    
    <!-- Bagian Totalitas Pembayaran -->
    <div class="flex-row"><strong>TOTAL</strong> <span id="struk-total">Rp 0</span></div>
    <div class="flex-row"><span>BAYAR</span> <span id="struk-bayar">Rp 0</span></div>
    <div class="flex-row"><span>KEMBALI</span> <span id="struk-kembali">Rp 0</span></div>
    
    <div class="garis-tebal"></div>
    
    <strong>*** TERIMA KASIH ***</strong><br>
    Barang yang sudah dibeli<br>
    tidak dapat ditukar/dikembalikan
    
    <div class="garis-pemisah"></div>
    
    <!-- Catatan Kaki Baru & QR Code -->
    <span style="font-size: 12px; font-weight: bold;">Kunjungi situs kami:</span>
    <div class="qr-wrapper">
        <div id="qrcode"></div>
    </div>
</div>

<!-- 3. LOGIKA SISTEM (JAVASCRIPT) -->
<script>
    // Inisialisasi Kode QR Otomatis ke Target URL saat halaman dimuat
    const urlSitus = "https://github.io";
    const qrCodeGenerator = new QRCode(document.getElementById("qrcode"), {
        text: urlSitus,
        width: 110,
        height: 110,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });

    let hargaSatuan = 0;
    let totalTransaksi = 0;

    function hitungSubtotal() {
        const select = document.getElementById('pilih-barang');
        const qty = parseInt(document.getElementById('qty-barang').value) || 1;
        const selectedOption = select.options[select.selectedIndex];
        
        if (selectedOption.value !== "") {
            hargaSatuan = parseInt(selectedOption.getAttribute('data-harga'));
            totalTransaksi = hargaSatuan * qty;
            
            // Perbarui visual item list di dalam struk preview
            document.getElementById('item-list-struk').innerHTML = `
                <div class="flex-row">
                    <span class="text-left">${selectedOption.value}</span>
                    <span class="text-right">x${qty}</span>
                    <span class="text-right">Rp ${totalTransaksi.toLocaleString('id-ID')}</span>
                </div>
            `;
            document.getElementById('struk-total').innerText = "Rp " + totalTransaksi.toLocaleString('id-ID');
        } else {
            resetStruk();
        }
        hitungKembalian();
    }

    function hitungKembalian() {
        const uangBayar = parseInt(document.getElementById('uang-bayar').value) || 0;
        const kembalian = uangBayar - totalTransaksi;
        
        document.getElementById('struk-bayar').innerText = "Rp " + uangBayar.toLocaleString('id-ID');
        document.getElementById('struk-kembali').innerText = "Rp " + (kembalian < 0 ? 0 : kembalian).toLocaleString('id-ID');
    }

    function resetStruk() {
        totalTransaksi = 0;
        document.getElementById('item-list-struk').innerHTML = `<div class="flex-row"><span class="text-left">Belum ada item dipilih</span><span class="text-right">Rp 0</span></div>`;
        document.getElementById('struk-total').innerText = "Rp 0";
    }

    function prosesTransaksi() {
        const select = document.getElementById('pilih-barang').value;
        if (!select) {
            alert('Silakan pilih barang atau layanan terlebih dahulu!');
            return;
        }
        // Menjalankan jendela print bawaan browser untuk mengirim perintah ke printer kasir/thermal
        window.print();
    }
</script>

</body>
</html>
